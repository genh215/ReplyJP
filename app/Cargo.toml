[package]
name = "ReplyJP"
version = "0.1.10"
edition = "2021"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
